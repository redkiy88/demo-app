apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-service
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: weather-service
  template:
    metadata:
      labels:
        app: weather-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      imagePullSecrets:
        - name: ghcr-creds

      containers:
        - name: weather-service
          image: ghcr.io/redkiy88/weather-service:1.0.1

          ports:
            - name: grpc
              containerPort: 9090

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          # No HTTP health endpoint: a TCP check on the gRPC port is enough here.
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10

          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: weather-service
  namespace: demo
spec:
  selector:
    app: weather-service
  ports:
    - name: grpc
      port: 9090
      targetPort: grpc
