# JSON access log matching the shape of the Go services' slog output
# (time/level/msg/service keys), so it drops into the same log pipeline
# (Kibana/Graylog, still TBD) without a separate parser.
log_format json_combined escape=json
  '{'
  '"time":"$time_iso8601",'
  '"level":"INFO",'
  '"msg":"request",'
  '"service":"frontend",'
  '"method":"$request_method",'
  '"path":"$uri",'
  '"status":$status,'
  '"remote_addr":"$remote_addr",'
  '"request_time_s":$request_time'
  '}';

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout json_combined;
    error_log /dev/stderr warn;

    location / {
        try_files $uri /index.html;
    }
}
